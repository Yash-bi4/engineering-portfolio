<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About | Yash Kumar Kuiya</title>
  <meta name="description" content="About Yash Kumar Kuiya: experience, education, and skills.">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="about">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="nav-name" href="index.html">Yash Kumar Kuiya</a>
      <ul class="nav-tabs">
        <li><a href="projects.html">Projects</a></li>
        <li><a href="about.html" aria-current="page">About</a></li>
        <li><a href="resume.html">Resume</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container">
    <h1 class="page-title">About</h1>

    <section class="bio" aria-label="Bio">
      <img id="bio-photo" class="bio-photo" alt="">
      <div id="bio-text"></div>
    </section>

    <section aria-labelledby="timeline-h">
      <h2 id="timeline-h" class="section-label">Experience and education</h2>
      <div class="filters" role="group" aria-label="Filter timeline">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="work" aria-pressed="false">Work</button>
        <button type="button" data-filter="education" aria-pressed="false">Education</button>
      </div>
      <p class="hint">Select an entry to show details.</p>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section aria-labelledby="activities-h">
      <h2 id="activities-h" class="section-label">Activities</h2>
      <ul class="activities" id="activities"></ul>
    </section>

    <section aria-labelledby="skills-h">
      <h2 id="skills-h" class="section-label">Skills</h2>
      <div class="skills" id="skills"></div>
    </section>

    <section aria-labelledby="contact-h">
      <h2 id="contact-h" class="section-label">Contact</h2>
      <ul class="contact" id="contact"></ul>
    </section>

    <div id="load-error" class="notice" hidden></div>
  </main>

  <footer class="site-footer container" id="footer"></footer>
  <script src="main.js"></script>
